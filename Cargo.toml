[package]
name = "bark"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"
wgpu = "27.0"
pollster = "0.2"
glam = "0.30"
obj-rs = "0.7"
image = "0.25"
intel_tex_2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hex = { version = "0.4", features = ["serde"] }
# ktx2 = "0.4.0"

[profile.dev.package."*"]
opt-level = 3
